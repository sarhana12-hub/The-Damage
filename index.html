<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Damage</title>
<meta name="description" content="Split a restaurant bill after the fact — scan the receipt, tag who had what, and every total ties to the penny.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#17120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Damage">
<style>
  :root{
    --bg:#17120F; --bg-lift:#1E1814; --card:#221B16; --card-2:#2A211B;
    --ink:#F6EDE0; --ink-soft:#A5947F; --ink-dim:#786959;
    --border:#33291F; --border-soft:#2A2119;
    --brass:#E0A458; --brass-deep:#C2823A; --brass-soft:rgba(224,164,88,.13); --on-brass:#1A1109;
    --ember:#D2694A; --ember-soft:rgba(210,105,74,.14);
    --sage:#8FB08A; --sage-soft:rgba(143,176,138,.14);
    --radius:16px;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:none;
  }
  .shell{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
  button{font:inherit;color:inherit;touch-action:manipulation;}
  input,textarea,select{font:inherit;color:inherit;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
  .money{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px;}

  /* ---------- buttons ---------- */
  .btn{border:none;border-radius:999px;padding:14px 20px;font-weight:650;cursor:pointer;transition:transform .1s, opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.975);}
  .btn-primary{background:var(--brass);color:var(--on-brass);}
  .btn-secondary{background:var(--card-2);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--ink-soft);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.4;cursor:default;}
  .btn-sm{padding:9px 14px;font-size:13px;}
  .link-btn{background:none;border:none;color:var(--brass);font-weight:600;cursor:pointer;padding:8px;}
  .icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:10px;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;}
  .icon-btn:active{background:var(--card-2);}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-weight:600;cursor:pointer;padding:6px 8px 6px 0;font-size:14px;display:inline-flex;align-items:center;gap:4px;}

  /* ---------- chrome ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px;min-height:52px;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;}
  .topbar .sub{color:var(--ink-dim);font-size:12.5px;margin-top:2px;}
  .steps{display:flex;gap:5px;padding:2px 18px 12px;}
  .steps i{height:3px;flex:1;border-radius:2px;background:var(--border);display:block;}
  .steps i.done{background:var(--brass-deep);}
  .steps i.now{background:var(--brass);}
  .body{flex:1;padding:0 18px 40px;}
  .footbar{position:sticky;bottom:0;background:linear-gradient(to top, var(--bg) 62%, rgba(23,18,15,0));padding:16px 18px calc(16px + env(safe-area-inset-bottom));margin-top:auto;}
  .footbar .hint{text-align:center;color:var(--ink-dim);font-size:12.5px;margin:8px 0 0;}

  /* ---------- cards & type ---------- */
  .card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card-flush{padding:0;overflow:hidden;}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-dim);margin:22px 0 10px;font-weight:700;}
  .helper{color:var(--ink-soft);font-size:14px;line-height:1.5;margin:0 0 18px;}
  .empty{text-align:center;color:var(--ink-dim);padding:28px 16px;font-size:14px;line-height:1.5;}
  .note{background:var(--brass-soft);border:1px solid rgba(224,164,88,.22);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;margin-bottom:14px;}
  .warn{background:var(--ember-soft);border:1px solid rgba(210,105,74,.3);color:#F0C3B2;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;margin-bottom:14px;}

  /* ---------- fields ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;}
  .text-input, .field input, .field textarea{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-lift);color:var(--ink);-webkit-appearance:none;
  }
  .text-input:focus, .field input:focus, .field textarea:focus{outline:2px solid var(--brass-deep);outline-offset:1px;border-color:transparent;}
  .field input::placeholder, textarea::placeholder{color:var(--ink-dim);}
  .paste-area{min-height:150px;resize:vertical;line-height:1.4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}

  /* ---------- home ---------- */
  .hero{text-align:center;padding:7vh 6px 30px;}
  .hero .mark{line-height:1;margin-bottom:18px;display:flex;justify-content:center;}
  .hero h1{font-size:30px;margin:0 0 8px;letter-spacing:-.6px;}
  .hero p{color:var(--ink-soft);margin:0;font-size:15px;line-height:1.5;}
  .home-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .resume-card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--brass-deep);border-radius:var(--radius);padding:14px 16px;cursor:pointer;margin-bottom:10px;}
  .resume-card .t{font-weight:650;}
  .resume-card .s{color:var(--ink-dim);font-size:12.5px;margin-top:2px;}

  .home-top{display:flex;justify-content:flex-end;padding:12px 14px 0;}

  /* ---------- scanning ---------- */
  .busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16vh 24px;text-align:center;color:var(--ink-soft);line-height:1.5;}
  .spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brass);animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .or-rule{display:flex;align-items:center;gap:12px;color:var(--ink-dim);font-size:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin:20px 0 14px;}
  .or-rule::before,.or-rule::after{content:"";flex:1;height:1px;background:var(--border);}

  /* ---------- prefixed + paired inputs ---------- */
  .prefix-field{display:flex;align-items:center;background:var(--bg-lift);border:1px solid var(--border);border-radius:12px;padding-left:13px;}
  .prefix-field:focus-within{outline:2px solid var(--brass-deep);outline-offset:1px;border-color:transparent;}
  .prefix-field .prefix{color:var(--ink-dim);font-weight:650;}
  .prefix-field input{flex:1;min-width:0;background:none;border:none;padding:13px 13px 13px 2px;}
  .prefix-field input:focus{outline:none;}

  /* ---------- send list ---------- */
  .send-row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border-soft);}
  .send-row:last-child{border-bottom:none;}
  .send-row .grow{flex:1;min-width:0;}
  .send-row .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .send-row .sm{color:var(--ink-dim);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .send-row .amt{font-weight:700;font-size:15px;}
  .send-btn{border:none;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;background:var(--brass);color:var(--on-brass);
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;text-decoration:none;}
  .send-btn:active{transform:scale(.97);}
  .send-btn.alt{background:var(--card-2);color:var(--ink);border:1px solid var(--border);}
  .you-tag{background:var(--sage-soft);color:var(--sage);border:1px solid rgba(143,176,138,.3);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.4px;}

  /* ---------- avatars ---------- */
  .av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:750;letter-spacing:.2px;color:#1A1109;flex:0 0 auto;}
  .av-sm{width:22px;height:22px;font-size:9.5px;}
  .av-lg{width:40px;height:40px;font-size:14px;}
  .av-stack{display:flex;align-items:center;}
  .av-stack .av{margin-left:-7px;box-shadow:0 0 0 2px var(--card);}
  .av-stack .av:first-child{margin-left:0;}

  /* ---------- item rows ---------- */
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border-soft);}
  .row:last-child{border-bottom:none;}
  .row-tap{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .row-tap:active{background:var(--card-2);}
  .row .grow{flex:1;min-width:0;}
  .row .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .meta{color:var(--ink-dim);font-size:12px;margin-top:4px;display:flex;align-items:center;gap:6px;}
  .row .amt{font-weight:650;font-size:15px;}
  .qty{background:var(--card-2);border:1px solid var(--border);color:var(--ink-soft);border-radius:6px;padding:1px 5px;font-size:11px;font-weight:700;}
  .row.unassigned{background:rgba(210,105,74,.05);}
  .flag{color:var(--ember);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .row-edit{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-soft);}
  .row-edit .ename{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-lift);}
  .row-edit .eprice{width:92px;text-align:right;padding:11px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-lift);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .row-edit input:focus{outline:2px solid var(--brass-deep);outline-offset:1px;}

  /* ---------- totals block ---------- */
  .tot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;font-size:14.5px;}
  .tot .lbl{color:var(--ink-soft);}
  .tot.grand{border-top:1px solid var(--border);margin-top:6px;padding-top:14px;font-size:18px;font-weight:750;}
  .tot.grand .lbl{color:var(--ink);}
  .tot-input{width:108px;text-align:right;padding:10px 11px;border-radius:10px;border:1px solid var(--border);background:var(--bg-lift);color:var(--ink);-webkit-appearance:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .tot-input:focus{outline:2px solid var(--brass-deep);outline-offset:1px;}
  .seg{display:flex;background:var(--bg-lift);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px;}
  .seg button{border:none;background:none;color:var(--ink-dim);font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .seg button.on{background:var(--brass);color:var(--on-brass);}
  .tiechip{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:600;margin-top:12px;line-height:1.4;}
  .tiechip.ok{background:var(--sage-soft);color:var(--sage);border:1px solid rgba(143,176,138,.25);}
  .tiechip.off{background:var(--ember-soft);color:#F0C3B2;border:1px solid rgba(210,105,74,.3);}

  /* ---------- people ---------- */
  .pgrid{display:flex;flex-wrap:wrap;gap:8px;}
  .ptile{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;font-size:14px;transition:border-color .12s;}
  .ptile.on{border-color:var(--brass);background:var(--brass-soft);}
  .ptile .tick{color:var(--brass);display:none;}
  .ptile.on .tick{display:inline-flex;}
  .ptile.add{border-style:dashed;color:var(--ink-soft);padding-left:14px;}

  /* ---------- results ---------- */
  .person-card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .person-head{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;width:100%;background:none;border:none;text-align:left;}
  .person-head .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px;}
  .person-head .sm{color:var(--ink-dim);font-size:12.5px;margin-top:3px;}
  .person-head .amt{font-size:19px;font-weight:750;margin-left:auto;}
  .person-head .chev{color:var(--ink-dim);transition:transform .15s;flex:0 0 auto;}
  .person-card.open .person-head .chev{transform:rotate(90deg);}
  .person-detail{border-top:1px solid var(--border-soft);padding:6px 16px 14px;background:var(--bg-lift);}
  .dline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;color:var(--ink-soft);}
  .dline .dn{flex:1;min-width:0;}
  .dline .dv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:0 0 auto;}
  .dline.sum{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;color:var(--ink);font-weight:700;}
  .payer-tag{background:var(--brass-soft);color:var(--brass);border:1px solid rgba(224,164,88,.25);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:750;text-transform:uppercase;letter-spacing:.4px;}

  /* ---------- bottom sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(8,5,3,.6);z-index:40;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--border);
    max-width:480px;margin:0 auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:rise .22s cubic-bezier(.2,.8,.3,1);}
  @keyframes rise{from{transform:translateY(24px);opacity:.4;}to{transform:none;opacity:1;}}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:2px auto 14px;}
  .sheet h3{margin:0 0 4px;font-size:18px;}
  .sheet .sub{color:var(--ink-dim);font-size:13px;margin:0 0 16px;line-height:1.45;}
  .sheet-row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border:none;background:none;border-radius:12px;cursor:pointer;text-align:left;}
  .sheet-row:active{background:var(--card-2);}
  .sheet-row.on{background:var(--brass-soft);}
  .sheet-row .nm{flex:1;font-weight:600;}
  .sheet-row .tick{color:var(--brass);opacity:0;flex:0 0 auto;}
  .sheet-row.on .tick{opacity:1;}
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .sheet-actions .btn{flex:1;}

  /* ---------- misc ---------- */
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
    background:#0F0B08;color:var(--ink);border:1px solid var(--border);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:60;box-shadow:var(--shadow);max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .steps-list{counter-reset:s;padding:0;margin:0;list-style:none;}
  .steps-list li{counter-increment:s;position:relative;padding:0 0 16px 34px;color:var(--ink-soft);font-size:14px;line-height:1.5;}
  .steps-list li::before{content:counter(s);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;background:var(--brass-soft);color:var(--brass);
    font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;}
  .steps-list li b{color:var(--ink);font-weight:650;}
  .kbd{background:var(--card-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:12.5px;color:var(--ink);white-space:nowrap;}
  .link-copy{display:flex;align-items:center;gap:8px;width:100%;background:var(--bg-lift);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    font-size:12.5px;color:var(--ink-soft);cursor:pointer;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .link-copy span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
(function(){
  "use strict";

  var APP_URL = location.origin + location.pathname.replace(/index\.html$/, '');

  // Warm, candle-lit palette. Every hue is chosen to stay legible as dark text
  // on its own circle and as a name against the near-black background.
  var PERSON_COLORS = ['#E0A458','#D2694A','#8FB08A','#6FA8BF','#B489C9','#D98BA0','#A8B25C','#8E93D1'];

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

  function initials(name){
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function todayIso(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(iso){
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  /* ---------------- money ----------------
     Everything is integer cents from the moment it is parsed until the moment
     it is printed. Floats never touch a running total, so nothing drifts and
     the per-person shares can be made to sum to the receipt total exactly. */
  function fmtMoney(cents){
    var n = Math.abs(cents || 0);
    var s = '$' + Math.floor(n / 100).toLocaleString() + '.' + String(n % 100).padStart(2, '0');
    return (cents < 0 ? '-' : '') + s;
  }
  function fmtPlain(cents){
    if (cents == null) return '';
    var n = Math.abs(cents);
    return (cents < 0 ? '-' : '') + Math.floor(n / 100) + '.' + String(n % 100).padStart(2, '0');
  }
  // Accepts "12.34", "$1,234.56", "12", "(3.50)" and "-3.50". Returns null for
  // anything that is not a number, so callers can distinguish 0 from blank.
  function parseMoney(str){
    if (str == null) return null;
    var s = String(str).trim();
    if (!s) return null;
    var neg = /^\(.*\)$/.test(s) || /^-/.test(s);
    s = s.replace(/[()\s$]/g, '').replace(/^-/, '').replace(/,/g, '');
    if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return null;
    var parts = s.split('.');
    var dollars = parseInt(parts[0] || '0', 10);
    var frac = (parts[1] || '').slice(0, 2).padEnd(2, '0');
    var cents = dollars * 100 + parseInt(frac, 10);
    if (!isFinite(cents)) return null;
    return neg ? -cents : cents;
  }

  // Largest-remainder apportionment. Gives each weight its exact floor share,
  // then hands the leftover pennies to whoever was cheated most by the floor.
  // The result always sums to `total` exactly — that guarantee is the whole
  // reason the app can promise the split ties to the receipt.
  function allocate(total, weights){
    var n = weights.length;
    var out = new Array(n).fill(0);
    if (!n || !total) return out;
    var sign = total < 0 ? -1 : 1;
    var amount = Math.abs(total);
    var sum = weights.reduce(function(a, b){ return a + b; }, 0);
    var w = weights;
    if (sum <= 0){ w = weights.map(function(){ return 1; }); sum = n; }
    var used = 0;
    var rema = [];
    for (var i = 0; i < n; i++){
      var exact = amount * w[i] / sum;
      var floor = Math.floor(exact);
      out[i] = floor;
      used += floor;
      rema.push({ i: i, frac: exact - floor });
    }
    var left = amount - used;
    // Sort by the size of the lost fraction; ties go to the earlier person so
    // the same input always produces the same output.
    rema.sort(function(a, b){ return (b.frac - a.frac) || (a.i - b.i); });
    for (var k = 0; k < left; k++) out[rema[k % n].i] += 1;
    for (var j = 0; j < n; j++) out[j] *= sign;
    return out;
  }

  var toastTimer = null;
  function showToast(message){
    var el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }
  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject();
      }catch(e){ reject(e); }
    });
  }

  /* ---------------- state ---------------- */
  function defaultUi(){ return { view:'home', sheet:null, open:{}, editing:false }; }
  function defaultSettings(){ return { venmo: '', meId: null, geminiKey: '', geminiModel: '' }; }
  // `dinner` is the one being worked on; `dinners` are the finished ones,
  // newest first. Nothing is ever destroyed to make room for a new split.
  function defaultState(){ return { roster: [], dinner: null, dinners: [], settings: defaultSettings(), ui: defaultUi() }; }
  var KEEP_SPLITS = 60;

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.roster)){
          if (!parsed.ui) parsed.ui = defaultUi();
          if (!parsed.ui.open) parsed.ui.open = {};
          if (!parsed.settings) parsed.settings = defaultSettings();
          if (!Array.isArray(parsed.dinners)) parsed.dinners = [];
          // An open sheet is a moment, not a place. Coming back to the app
          // should never restore a half-finished dialog over the top — and
          // the same goes for a spinner or an error from a scan that is over.
          parsed.ui.sheet = null;
          parsed.ui.busy = null;
          parsed.ui.scanError = '';
          return parsed;
        }
      }
    }catch(e){}
    return defaultState();
  }
  var state = load();
  // A shared link is read-only and must never overwrite the reader's own
  // dinner, so it lives outside `state` entirely and is never saved.
  var sharedView = null;

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ roster: state.roster, dinner: state.dinner, dinners: state.dinners, settings: state.settings, ui: state.ui }));
    }catch(e){}
  }

  function nextColor(){
    var used = {};
    state.roster.forEach(function(p){ used[p.color] = (used[p.color] || 0) + 1; });
    var best = PERSON_COLORS[0], bestN = Infinity;
    PERSON_COLORS.forEach(function(c){
      var n = used[c] || 0;
      if (n < bestN){ bestN = n; best = c; }
    });
    return best;
  }
  function rosterAdd(name){
    var clean = String(name || '').trim();
    if (!clean) return null;
    var existing = state.roster.filter(function(p){ return p.name.toLowerCase() === clean.toLowerCase(); })[0];
    if (existing) return existing;
    var person = { id: uid(), name: clean, color: nextColor(), phone: '', venmo: '' };
    state.roster.push(person);
    return person;
  }

  /* ---------------- reaching people ----------------
     Phone numbers and the Venmo handle live only in localStorage on this
     device. The handle is deliberately put into a shared breakdown — that is
     the point of it — but a phone number never is: see encodeShare, which
     copies only names and colours. */

  function venmoTag(){
    var v = String((state.settings && state.settings.venmo) || '').trim().replace(/^@+/, '');
    return v ? '@' + v : '';
  }
  // Whose handle to quote depends on who is owed, which is not always you.
  // Your own handle lives in Settings; everyone else's sits on their roster
  // entry, so a dinner someone else paid for can still say where to send it.
  function handleFor(p){
    if (!p) return '';
    var mine = state.settings.meId && p.id === state.settings.meId;
    var raw = mine ? (state.settings.venmo || p.venmo) : p.venmo;
    raw = String(raw || '').trim().replace(/^@+/, '');
    return raw ? '@' + raw : '';
  }
  function isMe(p){ return !!(p && state.settings.meId && p.id === state.settings.meId); }
  // Keep digits, and a leading + for international numbers. Everything a
  // person might type around them — spaces, dashes, brackets — is noise.
  function cleanPhone(raw){
    var s = String(raw || '').trim();
    var plus = s.charAt(0) === '+';
    var digits = s.replace(/\D/g, '');
    return digits ? (plus ? '+' : '') + digits : '';
  }
  function prettyPhone(raw){
    var s = cleanPhone(raw);
    var m = s.match(/^(\+1)?(\d{3})(\d{3})(\d{4})$/);
    return m ? (m[1] ? m[1] + ' ' : '') + '(' + m[2] + ') ' + m[3] + '-' + m[4] : s;
  }
  // iOS wants the body parameter joined with "&" even when it is the only one;
  // everywhere else follows RFC 5724 and uses "?".
  function smsHref(phone, body){
    var sep = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent || '') ? '&' : '?';
    return 'sms:' + cleanPhone(phone) + sep + 'body=' + encodeURIComponent(body);
  }
  function dinnerHead(d){
    return (d.place || 'Dinner') + (d.date ? ' · ' + fmtDate(d.date) : '');
  }

  // No link. The only reason to send one was the itemisation, and a person's
  // own share is a handful of lines — short enough to put in the message,
  // where it can be read at a glance instead of opening a page. It also means
  // the recipient needs nothing installed, and the text does not arrive with
  // four hundred characters of base64 stapled to it.
  //
  // The creditor is whoever picked up the check, which may well not be the
  // person holding the phone.
  function oweMessage(d, p){
    var payer = (d.people || []).filter(function(x){ return x.id === d.payerId; })[0];
    var tag = handleFor(payer);
    var out = [dinnerHead(d), 'You owe ' + (payer ? payer.name : 'whoever paid') + ' ' + fmtMoney(p.total), ''];
    (p.lines || []).forEach(function(l){
      var note = l.split > 1 ? ' (' + (l.orphan ? 'shared' : '1/' + l.split) + ' of ' + fmtMoney(l.full) + ')' : '';
      out.push('· ' + (l.qty > 1 ? l.qty + '× ' : '') + l.name + note + '  ' + fmtMoney(l.cents));
    });
    if (p.tax) out.push('· Tax  ' + fmtMoney(p.tax));
    if (p.tip) out.push('· Tip  ' + fmtMoney(p.tip));
    if (p.adj) out.push('· Share of the rest  ' + fmtMoney(p.adj));
    if (tag){ out.push(''); out.push('Venmo ' + tag); }
    return out.join('\n');
  }

  // What you send the person who paid, when that was not you.
  function payerMessage(d, mine){
    return dinnerHead(d) + '\nI owe you ' + fmtMoney(mine.total) + ' for my share — sending it over.';
  }

  function newDinner(){
    return {
      id: uid(),
      place: '',
      date: todayIso(),
      createdAt: Date.now(),
      people: [],
      payerId: null,
      items: [],
      tax: null,
      tip: null,
      total: null,
      tipMode: 'amt',
      tipPct: 20,
      parsedSubtotal: null,
      sawText: false
    };
  }
  function D(){ return state.dinner; }
  function person(id){
    var d = D();
    if (!d) return null;
    for (var i = 0; i < d.people.length; i++) if (d.people[i].id === id) return d.people[i];
    return null;
  }

  /* ---------------- receipt parser ----------------
     Input is whatever iOS Live Text (or a copied email receipt) produced. It
     arrives as plain lines, in reading order, with the column structure mostly
     but not always preserved — so the parser handles four real-world shapes:

       "2  Burger        38.00"   price on the line
       "Burger ......... 18.00"   dot leaders
       "Burger"  /  "18.00"       name and price on consecutive lines
       names block then prices block (two columns read top-to-bottom)

     Nothing here is trusted blindly. Everything it produces lands on a review
     screen where each line can be corrected, because a receipt that scans 90%
     right and is then fixed by hand beats one that scans 100% right in theory. */

  var PRICE_TAIL = /(?:^|[\s.·•])(\(?-?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?)\s*[A-Z*#]{0,2}$/;
  var PRICE_ONLY = /^\(?-?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?\s*[A-Z*#]{0,2}$/;

  var RE = {
    subtotal: /^sub[\s-]*total\b|^sub\b/i,
    tax:      /^(sales\s+|state\s+|local\s+|city\s+)?tax\b|^gst\b|^hst\b|^pst\b|^vat\b|\btax\s*\(/i,
    tip:      /\btips?\b|\bgratuity\b|\bservice\s+(charge|fee)\b|\bauto[\s-]?grat/i,
    total:    /^(grand\s+|order\s+|check\s+|final\s+)?total\b|^amount\s+due\b|^balance\s+due\b|^total\s+due\b|^amount\s+paid\b/i,
    // Payment tender, card footers and the rest of the receipt furniture.
    noise:    /^(cash|change|card|visa|mastercard|master card|amex|american express|discover|debit|credit|tender|payment|chg|approval|auth|ref|acct|account|entry|aid|tvr|tsi|mode|terminal|merchant|batch|seq|trace|invoice|check|chk|guests?|covers?|server|cashier|host|table|station|order|ticket|store|reg|register|date|time|phone|tel|fax|qty|item|description|amount|price|www|http|thank|thanks|please|customer copy|merchant copy|signature|sign|x{3,}|-{3,}|={3,}|\*{3,})\b/i,
    junk:     /^[\s.\-=_*#|~]+$/,
    dateish:  /^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b|^\d{1,2}:\d{2}\s*(am|pm)?$/i,
    phone:    /^\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}$/,
    pctish:   /\b\d{1,2}(\.\d)?\s*%/,
    qtyLead:  /^(\d{1,2})\s*(?:x|X|@)?\s+(?=[A-Za-z(])/,
    qtyTrail: /\s+[xX]\s*(\d{1,2})$/,
    atRate:   /\s+\d{1,2}\s*@\s*\$?\d+\.\d{2}\s*$/
  };

  function cleanLine(s){
    return String(s)
      .replace(/ /g, ' ')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/\s+/g, ' ')
      .trim();
  }
  // Strip dot leaders, a trailing "2 @ 9.00" rate note, and leftover separators.
  function cleanName(s){
    return String(s)
      .replace(RE.atRate, '')
      .replace(/[\s.·•_\-]{2,}$/, '')
      .replace(/^[\s.·•_\-|]+/, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function titleish(s){
    // Receipts shout. Convert a fully-uppercase name to Title Case, but leave
    // mixed-case names (and short all-caps words like BLT) alone.
    if (!/[a-z]/.test(s) && s.length > 3){
      return s.toLowerCase().replace(/\b([a-z])/g, function(m, c){ return c.toUpperCase(); });
    }
    return s;
  }

  function splitPrice(line){
    var m = line.match(PRICE_TAIL);
    if (!m) return { name: line, cents: null };
    var cents = parseMoney(m[1]);
    if (cents == null) return { name: line, cents: null };
    // m.index sits on the separator before the amount, so everything to its
    // left is the item name.
    return { name: line.slice(0, m.index).trim(), cents: cents };
  }

  function metaKind(text){
    if (RE.subtotal.test(text)) return 'subtotal';
    if (RE.tax.test(text)) return 'tax';
    if (RE.tip.test(text)) return 'tip';
    if (RE.total.test(text)) return 'total';
    return null;
  }

  function isNoise(text){
    if (!text) return true;
    if (RE.junk.test(text)) return true;
    if (RE.dateish.test(text)) return true;
    if (RE.phone.test(text)) return true;
    if (RE.noise.test(text)) return true;
    if (!/[A-Za-z]/.test(text)) return true;
    return false;
  }

  function parseReceipt(raw){
    var out = {
      items: [], place: '', subtotal: null, tax: null, tip: null, total: null,
      skipped: 0, pairedLoosely: false
    };
    var lines = String(raw || '').split(/\r?\n/).map(cleanLine).filter(function(l){ return l.length > 0; });
    if (!lines.length) return out;

    var totalCands = [], tipCands = [], taxCands = [], subCands = [];
    var entries = [];   // ordered stream of {kind, name, cents}
    var sawMeta = false;

    for (var i = 0; i < lines.length; i++){
      var line = lines[i];
      var sp = splitPrice(line);
      var nameRaw = cleanName(sp.name);
      var cents = sp.cents;

      var kind = metaKind(nameRaw || line);
      if (kind){
        // A total keyword with no amount on the line usually means the amount
        // wrapped to the next line.
        if (cents == null && i + 1 < lines.length && PRICE_ONLY.test(lines[i + 1])){
          cents = parseMoney(lines[i + 1]);
          i++;
        }
        if (cents != null){
          sawMeta = true;
          var rec = { cents: cents, pct: RE.pctish.test(line) };
          if (kind === 'subtotal') subCands.push(rec);
          else if (kind === 'tax') taxCands.push(rec);
          else if (kind === 'tip') tipCands.push(rec);
          else totalCands.push(rec);
        }
        continue;
      }

      if (cents != null && nameRaw && !isNoise(nameRaw)){
        entries.push({ kind: 'item', name: nameRaw, cents: cents });
      } else if (cents != null && !nameRaw){
        entries.push({ kind: 'price', cents: cents });
      } else if (cents == null && !isNoise(line)){
        entries.push({ kind: 'name', name: nameRaw || line });
      } else {
        out.skipped++;
      }
    }

    // Pass 0: a run of names followed by an equally long run of prices is a
    // two-column receipt, read down one column and then the other. This has to
    // settle before the adjacent-pair rule below, which would otherwise marry
    // the last name of the block to the first price of the block and leave
    // every other item paired with its neighbour's amount.
    for (var c = 0; c < entries.length; c++){
      if (entries[c].kind !== 'name') continue;
      var ns = c;
      while (ns < entries.length && entries[ns].kind === 'name') ns++;
      var ps = ns;
      while (ps < entries.length && entries[ps].kind === 'price') ps++;
      var nameRun = ns - c, priceRun = ps - ns;
      if (nameRun >= 2 && nameRun === priceRun){
        for (var q = 0; q < nameRun; q++){
          entries[c + q] = { kind: 'item', name: entries[c + q].name, cents: entries[ns + q].cents };
          entries[ns + q].used = true;
        }
        out.pairedLoosely = true;
      }
      c = ps - 1;
    }

    // Pass A: a bare name immediately followed by a bare price is one item.
    for (var a = 0; a < entries.length - 1; a++){
      if (entries[a].kind === 'name' && !entries[a].used && entries[a + 1].kind === 'price' && !entries[a + 1].used){
        entries[a] = { kind: 'item', name: entries[a].name, cents: entries[a + 1].cents };
        entries[a + 1].used = true;
      }
    }

    // Pass B: two-column layouts read as every name, then every price. If the
    // leftovers line up one-for-one, zip them in order — and say so, because
    // this is the pairing most likely to be wrong.
    var orphanNames = [], orphanPrices = [];
    entries.forEach(function(e){
      if (e.used) return;
      if (e.kind === 'name') orphanNames.push(e);
      else if (e.kind === 'price') orphanPrices.push(e);
    });
    if (orphanNames.length && orphanNames.length === orphanPrices.length){
      for (var z = 0; z < orphanNames.length; z++){
        orphanNames[z].kind = 'item';
        orphanNames[z].cents = orphanPrices[z].cents;
        orphanPrices[z].used = true;
      }
      out.pairedLoosely = true;
    }

    // Only now, once every name that had a price has claimed it, can a
    // leftover line at the top be read as the restaurant. Doing this first
    // would eat the first item on a receipt whose prices sit in their own
    // column — the name would be stolen before its price ever found it.
    for (var h = 0; h < entries.length; h++){
      var e0 = entries[h];
      if (e0.used) continue;
      if (e0.kind !== 'name') break;
      if (e0.name.length >= 3 && e0.name.length <= 42 && /[A-Za-z]/.test(e0.name)){
        out.place = titleish(e0.name);
        e0.used = true;
      }
      break;
    }

    entries.forEach(function(e){
      if (e.used) return;
      if (e.kind === 'item'){
        var name = e.name, qty = 1;
        var qm = name.match(RE.qtyLead);
        if (qm){ qty = parseInt(qm[1], 10) || 1; name = name.slice(qm[0].length); }
        else {
          var qt = name.match(RE.qtyTrail);
          if (qt){ qty = parseInt(qt[1], 10) || 1; name = name.slice(0, qt.index); }
        }
        name = titleish(cleanName(name));
        if (!name) name = 'Item';
        out.items.push({ id: uid(), name: name, cents: e.cents, qty: qty, who: [] });
      } else if (e.kind === 'price'){
        // A price with nothing to attach it to still belongs on the bill.
        out.items.push({ id: uid(), name: 'Unnamed item', cents: e.cents, qty: 1, who: [], needsName: true });
      } else {
        out.skipped++;
      }
    });

    // Prefer a stated amount over a percentage row: "20% 14.00" is a charge,
    // but a block of "18% 20% 22%" suggestions is just the receipt being helpful.
    function pick(cands, mode){
      if (!cands.length) return null;
      var solid = cands.filter(function(c){ return !c.pct; });
      var use = solid.length ? solid : (cands.length === 1 ? cands : []);
      if (!use.length) return null;
      if (mode === 'max') return use.reduce(function(a, b){ return b.cents > a.cents ? b : a; }).cents;
      return use[use.length - 1].cents;
    }
    out.subtotal = pick(subCands, 'last');
    out.tax = pick(taxCands, 'last');
    out.tip = pick(tipCands, 'last');
    // With a tip, a receipt often prints two totals (pre-tip and final). The
    // larger one is the amount actually charged to the card.
    out.total = pick(totalCands, 'max');
    out.sawMeta = sawMeta;
    return out;
  }

  /* ---------------- the split ----------------
     The receipt total is the one number that is not up for debate, so it is
     treated as ground truth and everything else is fitted to it:

       adjustment = total - items - tax - tip

     Anything the scan missed, a discount, a service charge, a resort fee, or a
     hand-written tip that changed the card total all land in that single
     figure, which is then shared out like every other shared cost. Because the
     four buckets are each apportioned with largest-remainder rounding, the sum
     of what everyone owes equals the receipt total exactly — never a penny off. */

  function effectiveTip(d, itemsSum){
    if (d.tipMode === 'pct'){
      var pct = typeof d.tipPct === 'number' ? d.tipPct : 0;
      return Math.round(itemsSum * pct / 100);
    }
    return d.tip || 0;
  }

  function computeSplit(d){
    var people = (d.people || []).map(function(p){
      return { id: p.id, name: p.name, color: p.color, food: 0, lines: [] };
    });
    var idx = {};
    people.forEach(function(p, i){ idx[p.id] = i; });

    var itemsSum = (d.items || []).reduce(function(a, it){ return a + (it.cents || 0); }, 0);
    var tax = d.tax || 0;
    var tip = effectiveTip(d, itemsSum);
    var total = (d.total != null) ? d.total : (itemsSum + tax + tip);
    var adjustment = total - itemsSum - tax - tip;

    var unassigned = 0;
    if (people.length){
      (d.items || []).forEach(function(it){
        var who = (it.who || []).filter(function(id){ return idx[id] != null; });
        var shared = false;
        if (!who.length){
          // An untagged item still has to be paid for. Spreading it across the
          // table keeps the total honest while the review screen nags about it.
          who = people.map(function(p){ return p.id; });
          unassigned++;
          shared = true;
        }
        var shares = allocate(it.cents || 0, who.map(function(){ return 1; }));
        who.forEach(function(id, k){
          var p = people[idx[id]];
          p.food += shares[k];
          p.lines.push({
            name: it.name,
            qty: it.qty || 1,
            cents: shares[k],
            full: it.cents || 0,
            split: who.length,
            orphan: shared
          });
        });
      });
    }

    // A discount tagged to one person can push their food share negative; a
    // negative weight would invert their share of tax, so floor it at zero.
    var weights = people.map(function(p){ return Math.max(0, p.food); });
    var taxParts = allocate(tax, weights);
    var tipParts = allocate(tip, weights);
    var adjParts = allocate(adjustment, weights);

    people.forEach(function(p, i){
      p.tax = taxParts[i];
      p.tip = tipParts[i];
      p.adj = adjParts[i];
      p.total = p.food + p.tax + p.tip + p.adj;
    });

    var sum = people.reduce(function(a, p){ return a + p.total; }, 0);
    return {
      people: people,
      itemsSum: itemsSum,
      tax: tax,
      tip: tip,
      adjustment: adjustment,
      total: total,
      unassigned: unassigned,
      sum: sum,
      ties: sum === total
    };
  }

  /* ---------------- share link ----------------
     The whole split is packed into the URL fragment, which never leaves the
     device on its way to the recipient's browser — no server, no database, no
     account. Short keys and person indexes keep a twelve-item dinner well
     under the length any messaging app will carry. */

  function b64urlEncode(str){
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDecode(s){
    var t = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var bin = atob(t);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  // `youIndex` personalises the link for one recipient: their row opens first
  // and is marked as theirs. It rides after a dot, which base64url never
  // produces, so the payload itself needs no escaping.
  function encodeShare(d, youIndex){
    var order = {};
    (d.people || []).forEach(function(p, i){ order[p.id] = i; });
    var itemsSum = (d.items || []).reduce(function(a, it){ return a + (it.cents || 0); }, 0);
    var payload = {
      v: 1,
      pl: d.place || '',
      dt: d.date || '',
      py: d.payerId != null && order[d.payerId] != null ? order[d.payerId] : -1,
      // The Venmo handle is deliberately NOT in here. It goes in the message
      // you send to a person you chose; a link outlives that choice and gets
      // forwarded on to people you never picked.
      // Names and colours only. A phone number is for this device to dial,
      // never for a link that will be forwarded around a group chat.
      pe: (d.people || []).map(function(p){
        var ci = PERSON_COLORS.indexOf(p.color);
        return [p.name, ci >= 0 ? ci : p.color];
      }),
      it: (d.items || []).map(function(it){
        return [it.name, it.cents || 0, it.qty || 1, (it.who || []).map(function(id){ return order[id]; }).filter(function(n){ return n != null; })];
      }),
      tx: d.tax || 0,
      tp: effectiveTip(d, itemsSum),
      tt: d.total != null ? d.total : null
    };
    var frag = b64urlEncode(JSON.stringify(payload));
    if (youIndex != null && youIndex >= 0) frag += '.' + youIndex;
    return APP_URL + 'index.html#s=' + frag;
  }

  // Rehydrates into the same shape computeSplit and the result view already
  // understand, so a shared link renders through exactly one code path.
  function decodeShare(frag){
    var dot = frag.indexOf('.');
    var youIndex = dot >= 0 ? parseInt(frag.slice(dot + 1), 10) : -1;
    var raw = JSON.parse(b64urlDecode(dot >= 0 ? frag.slice(0, dot) : frag));
    if (!raw || raw.v !== 1 || !Array.isArray(raw.pe) || !Array.isArray(raw.it)) throw new Error('bad payload');
    // A shared link is a stranger's input. Names are escaped where they are
    // printed, but a colour goes into a style attribute, so anything that is
    // not plainly a hex colour is thrown away rather than trusted — otherwise
    // a crafted link could smuggle CSS (a url() beacon, say) into the page.
    var people = raw.pe.map(function(p, i){
      var color;
      if (typeof p[1] === 'number') color = PERSON_COLORS[p[1]] || PERSON_COLORS[0];
      else color = /^#[0-9a-f]{3,8}$/i.test(String(p[1] || '')) ? String(p[1]) : PERSON_COLORS[i % PERSON_COLORS.length];
      return { id: 'p' + i, name: String(p[0] || 'Someone'), color: color };
    });
    return {
      id: 'shared',
      place: String(raw.pl || ''),
      date: String(raw.dt || ''),
      // Any handle in an older link is ignored rather than shown, so links
      // already sent stop carrying it too.
      venmo: '',
      youId: people[youIndex] ? people[youIndex].id : null,
      people: people,
      payerId: raw.py >= 0 && people[raw.py] ? people[raw.py].id : null,
      items: raw.it.map(function(it){
        return {
          id: uid(),
          name: String(it[0] || 'Item'),
          cents: it[1] | 0,
          qty: it[2] || 1,
          who: (it[3] || []).map(function(n){ return people[n] ? people[n].id : null; }).filter(Boolean)
        };
      }),
      tax: raw.tx | 0,
      tip: raw.tp | 0,
      tipMode: 'amt',
      tipPct: 0,
      total: raw.tt == null ? null : (raw.tt | 0)
    };
  }

  /* ---------------- reading a photographed receipt ----------------
     The camera opens inside the app; the picture is shrunk on the device and
     sent to a model that returns the line items already structured, so there
     is no OCR-then-guess-the-columns step at all.

     Everything about *where* that happens is confined to readReceiptImage
     below. Pointing it at a proxy instead of straight at Google is a change
     to that one function and nothing else. */

  var MAX_EDGE = 1600;        // small print stays legible, upload stays quick
  var JPEG_Q = 0.8;
  // Tried in order; whichever answers first is remembered in settings, so a
  // retired model id heals itself on the next scan instead of needing a push.
  var GEMINI_MODELS = ['gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash'];

  var SCAN_PROMPT = [
    'This is a photograph of a restaurant receipt. Transcribe it.',
    '',
    'Rules:',
    '- Return every ordered line item, in the order printed.',
    '- Use the extended price actually printed for that line (the price for the whole quantity), not the unit price.',
    '- Keep item names as printed, just cleaned of dot leaders and padding.',
    '- A modifier with its own price (for example "Add bacon 3.00") is its own line item.',
    '- Do NOT put subtotal, tax, tip, gratuity, service charge or total in the items array. Report those separately.',
    '- Ignore card numbers, server names, table numbers, addresses, phone numbers and marketing text.',
    '- A discount or comp is an item with a negative price.',
    '- If a suggested-tip table is printed (18% / 20% / 22%), that is NOT the tip. Only report a tip that was actually charged.',
    '- Every money value is an INTEGER NUMBER OF CENTS. 14.00 is 1400. A discount of 5.00 is -500.',
    '- If a value is not printed on the receipt, omit that field rather than guessing.',
    '- Do not invent items. If a line is unreadable, give your best transcription of the name and its price.'
  ].join('\n');

  var SCAN_SCHEMA = {
    type: 'object',
    properties: {
      place: { type: 'string' },
      items: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            name: { type: 'string' },
            qty: { type: 'integer' },
            price_cents: { type: 'integer' }
          },
          required: ['name', 'price_cents']
        }
      },
      subtotal_cents: { type: 'integer' },
      tax_cents: { type: 'integer' },
      tip_cents: { type: 'integer' },
      total_cents: { type: 'integer' }
    },
    required: ['items']
  };

  // Shrink on the phone before uploading. A 12MP camera frame is ~4MB and
  // adds seconds of upload for detail the model cannot use anyway.
  function fileToJpeg(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        try{
          var scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          var dataUrl = c.toDataURL('image/jpeg', JPEG_Q);
          resolve(dataUrl.slice(dataUrl.indexOf(',') + 1));
        }catch(err){ URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('That image could not be opened.')); };
      img.src = url;
    });
  }

  function geminiCall(model, b64){
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': state.settings.geminiKey.trim() },
      body: JSON.stringify({
        contents: [{ parts: [{ text: SCAN_PROMPT }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
        generationConfig: { temperature: 0, responseMimeType: 'application/json', responseSchema: SCAN_SCHEMA }
      })
    });
  }

  // The single seam between the app and whatever reads receipts.
  function readReceiptImage(b64){
    var key = (state.settings.geminiKey || '').trim();
    if (!key) return Promise.reject(new Error('NO_KEY'));

    var tries = [];
    if (state.settings.geminiModel) tries.push(state.settings.geminiModel);
    GEMINI_MODELS.forEach(function(m){ if (tries.indexOf(m) < 0) tries.push(m); });

    function attempt(i){
      if (i >= tries.length) return Promise.reject(new Error('No usable model. Check the key is a Gemini API key.'));
      return geminiCall(tries[i], b64).then(function(res){
        if (res.status === 404 || res.status === 400){
          // Wrong model name for this key: step to the next candidate.
          return res.text().then(function(t){
            if (/not found|not supported|unsupported|does not exist/i.test(t) && i + 1 < tries.length) return attempt(i + 1);
            throw new Error(friendlyError(res.status, t));
          });
        }
        if (!res.ok) return res.text().then(function(t){ throw new Error(friendlyError(res.status, t)); });
        state.settings.geminiModel = tries[i];
        save();
        return res.json();
      });
    }
    return attempt(0).then(parseGeminiJson);
  }

  function friendlyError(status, body){
    if (status === 401 || status === 403) return 'That API key was refused. Check it in Settings.';
    if (status === 429) return 'Google is rate-limiting the key. Wait a moment and try again.';
    if (status >= 500) return 'Google had a server error. Try again.';
    var m = /"message"\s*:\s*"([^"]{0,160})/.exec(body || '');
    return m ? m[1] : ('The reader returned an error (' + status + ').');
  }

  function parseGeminiJson(payload){
    var parts = payload && payload.candidates && payload.candidates[0] &&
                payload.candidates[0].content && payload.candidates[0].content.parts;
    var text = parts && parts.map(function(p){ return p.text || ''; }).join('');
    if (!text) throw new Error('The reader sent nothing back. Try another photo.');
    var raw;
    try{ raw = JSON.parse(text); }
    catch(e){
      // Belt and braces: dig the object out even if it arrives fenced.
      var s = text.indexOf('{'), e2 = text.lastIndexOf('}');
      if (s < 0 || e2 <= s) throw new Error('The reader sent something unreadable.');
      raw = JSON.parse(text.slice(s, e2 + 1));
    }
    var cents = function(v){ return typeof v === 'number' && isFinite(v) ? Math.round(v) : null; };
    return {
      place: typeof raw.place === 'string' ? raw.place.trim() : '',
      items: (raw.items || []).map(function(it){
        return {
          id: uid(),
          name: String(it.name == null ? 'Item' : it.name).trim() || 'Item',
          cents: cents(it.price_cents) || 0,
          qty: it.qty && it.qty > 0 ? it.qty : 1,
          who: []
        };
      }),
      subtotal: cents(raw.subtotal_cents),
      tax: cents(raw.tax_cents),
      tip: cents(raw.tip_cents),
      total: cents(raw.total_cents)
    };
  }

  // The running commentary on whether the numbers hang together. It is the
  // app's central promise, so it is visible while the totals are still being
  // typed rather than saved for the end.
  function tieChip(split){
    if (!split.adjustment){
      return '<div class="tiechip ok">' + ICONS.check + '<span>Items, tax and tip add up to the receipt total exactly.</span></div>';
    }
    var over = split.adjustment > 0;
    var word = over ? 'more than' : 'less than';
    return '<div class="tiechip off">' + ICONS.warn + '<span>The items, tax and tip come to ' + fmtMoney(Math.abs(split.adjustment)) + ' ' + word +
      ' the receipt total. That difference will be shared out in proportion to what each person ordered.</span></div>';
  }

  // Keeps the live figures honest while someone is typing, without a full
  // re-render that would yank the keyboard focus out of the field.
  function refreshTotals(){
    var d = D();
    if (!d) return;
    var split = computeSplit(d);
    var sumEl = document.getElementById('items-sum');
    if (sumEl) sumEl.textContent = fmtMoney(split.itemsSum);
    var tipEl = document.getElementById('tip-preview');
    if (tipEl) tipEl.textContent = fmtMoney(split.tip);
    var tie = document.getElementById('tie-slot');
    if (tie) tie.innerHTML = tieChip(split);
    var totalField = document.querySelector('[data-bind="total"]');
    if (totalField && !totalField.value){
      totalField.placeholder = fmtPlain(split.itemsSum + split.tax + split.tip);
    }
  }

  /* ---------------- result ---------------- */

    // renders through this same function.

      '<span><span class="nm">' + esc(p.name) +

      (d.youId === p.id ? ' <span class="you-tag">you</span>' : '') + '</span>' +
      '<span class="sm">' + esc(verb) + '</span></span>' +

  function renderResult(){
    var d = D();
    var split = computeSplit(d);
    var ranked = split.people.slice().sort(function(a, b){ return b.total - a.total; });
    var out = topbar(d.place || 'The damage', fmtDate(d.date) + ' · ' + fmtMoney(split.total), 'assign');
    out += stepbar('result');
    out += '<div class="body">';

    if (split.unassigned){
      out += '<div class="warn">' + split.unassigned + ' item' + (split.unassigned === 1 ? ' was' : 's were') +
        ' never tagged, so ' + (split.unassigned === 1 ? 'it is' : 'they are') + ' shared by everyone.</div>';
    }

    out += ranked.map(function(p){ return personCard(p, d); }).join('');
    out += '<h2 class="sec">How it adds up</h2>';
    out += summaryCard(split);

    var payerP = person(d.payerId);
    var payerTag = handleFor(payerP);
    var youPaid = isMe(payerP);

    // What you personally owe, when the check was someone else's. This is not
    // a message to send — it is a reminder to pay.
    var yours = state.settings.meId && !youPaid
      ? ranked.filter(function(p){ return p.id === state.settings.meId; })[0]
      : null;
    if (yours && payerP){
      out += '<h2 class="sec">Your share</h2>';
      out += '<div class="card" style="text-align:center;padding:18px 16px;">' +
        '<div style="color:var(--ink-soft);font-size:13.5px;">You owe ' + esc(payerP.name) + '</div>' +

        (payerTag ? '<div style="color:var(--brass);font-weight:700;">Venmo ' + esc(payerTag) + '</div>' : '') +
        '</div>';
    }

    out += '<h2 class="sec">' + (youPaid ? 'Tell everyone what they owe' : 'Pass it on to the others') + '</h2>';
    if (payerP && !payerTag){
      out += '<div class="note">Nobody is told where to send the money. Add ' +
        (youPaid ? 'your Venmo handle' : esc(payerP.name) + '&rsquo;s Venmo handle') + ' and every message will say. ' +

        (youPaid ? 'Add your handle' : 'Add it in who you dine with') + ' &rarr;</button></div>';
    }

    // Everyone in the party gets their own button — you send whichever ones
    // you want, and nobody is messaged as a side effect of messaging someone
    // else. The only person missing is you.
    var contacts = ranked.filter(function(p){ return p.id !== state.settings.meId; });
    if (!contacts.length){
      out += '<div class="empty">Nobody to message — there is only you here.</div>';
    } else {
      out += '<div class="card card-flush">' + contacts.map(function(p){
        var who = person(p.id) || {};
        var phone = cleanPhone(who.phone);
        var isPayer = p.id === d.payerId;
        // The person who paid is owed, not owing, so they get the other half
        // of the conversation.
        var msg = (isPayer && yours) ? payerMessage(d, yours) : oweMessage(d, p);
        var amount = (isPayer && yours) ? yours.total : p.total;
        var sub = isPayer && yours ? 'you owe them' : (phone ? prettyPhone(phone) : 'No number saved');
        return '<div class="send-row">' + avatar(p) +
          '<div class="grow"><div class="nm">' + esc(p.name) + (isPayer ? ' <span class="payer-tag">paid</span>' : '') + '</div>' +
          '<div class="sm">' + esc(sub) + '</div></div>' +
          '<div class="amt money">' + fmtMoney(amount) + '</div>' +
          (phone
            ? '<a class="send-btn' + (isPayer ? ' alt' : '') + '" href="' + esc(smsHref(phone, msg)) + '">' + ICONS.send + ' Text</a>'
            : '<button class="send-btn alt" data-action="copy-message" data-id="' + p.id + '">' + ICONS.copy + ' Copy</button>') +
          '</div>';
      }).join('') + '</div>';
      out += '<p class="helper" style="margin-top:10px;font-size:13px;">Send as many or as few as you like — each one is separate. The message lists that person&rsquo;s own items and their share of tax and tip' +
        (payerTag ? ', and ends with ' + esc(payerTag) : '') +
        ', so there is nothing to open and no link to wade through. ' +
        'Numbers and handles are saved against a name in <button class="link-btn" style="padding:0" data-action="go" data-view="roster">who you dine with</button>.</p>';
    }

    out += '<h2 class="sec">Or send one link to the group</h2>';
    var url = encodeShare(d);
    out += '<button class="link-copy" data-action="copy-link"><span>' + esc(url.replace(/^https?:\/\//, '')) + '</span>' + ICONS.link + '</button>';
    out += '<p class="helper" style="margin-top:10px;font-size:13px;">The whole breakdown is packed into that link. Anyone can open it — no app, no account, nothing stored anywhere. Neither your Venmo handle nor anyone&rsquo;s phone number is in it, so a link that gets forwarded on gives away nothing but the dinner.</p>';
    out += '</div>';

    out += footbar(
      '<button class="btn btn-primary btn-block" data-action="share-link">' + ICONS.share + ' Share the breakdown</button>' +
      '<button class="btn btn-secondary btn-block" style="margin-top:10px" data-action="finish-split">' + ICONS.check + ' Done — save this split</button>'
    );
    return out;
  }

  /* ---------------- shared (read-only) ---------------- */
  function renderShared(){
    var d = sharedView;
    var split = computeSplit(d);
    var ranked = split.people.slice().sort(function(a, b){ return b.total - a.total; });
    var payer = d.payerId ? d.people.filter(function(p){ return p.id === d.payerId; })[0] : null;

    var out = '<div class="topbar"><div><h1>' + esc(d.place || 'The damage') + '</h1>' +
      '<div class="sub">' + (d.date ? esc(fmtDate(d.date)) + ' · ' : '') + fmtMoney(split.total) + '</div></div></div>';
    var you = d.youId ? d.people.filter(function(p){ return p.id === d.youId; })[0] : null;
    var yourShare = you ? split.people.filter(function(p){ return p.id === you.id; })[0] : null;

    out += '<div class="body">';
    if (yourShare){
      // The link was addressed to one person, so lead with their number
      // rather than making them hunt for their own name in the list.
      out += '<div class="note" style="text-align:center;padding:18px 16px;">' +
        '<div style="color:var(--ink-soft);font-size:13.5px;">' + esc(you.name) + ', you owe' + (payer ? ' ' + esc(payer.name) : '') + '</div>' +
        '<div class="money" style="font-size:34px;font-weight:750;margin:6px 0 2px;">' + fmtMoney(yourShare.total) + '</div>' +
        '</div>';
    } else {
      out += '<div class="note">Someone shared this breakdown with you' + (payer ? '. ' + esc(payer.name) + ' put it all on one card' : '') + '. Tap a name to see the detail.</div>';
    }
    out += ranked.map(function(p){ return personCard(p, d); }).join('');
    out += '<h2 class="sec">How it adds up</h2>';
    out += summaryCard(split);
    out += '</div>';
    out += footbar('<button class="btn btn-primary btn-block" data-action="leave-shared">Split a bill of your own</button>');
    return out;
  }

  /* ---------------- roster ---------------- */
  function renderRoster(){
    var out = topbar('Who you dine with', null, 'home');

    out += '<p class="helper">Saved names show up as one-tap options every time you split a bill.</p>';

          '<div class="prefix-field" style="flex:1 0 100%;margin-left:42px;margin-top:8px;"><span class="prefix">@</span>' +
          '<input type="text" data-bind="roster-venmo" data-id="' + p.id + '" value="' + esc(String(p.venmo || '').replace(/^@+/, '')) + '" placeholder="Venmo handle (for when they pay)" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Venmo handle for ' + esc(p.name) + '"></div>' +
