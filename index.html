  /* ---------------- one-tap scanning ---------------- */
  // The fallback for when a scan misbehaves. There used to be an iOS Shortcut
  // here; it is gone, because it returned through an https link, which opens
  // Safari rather than the installed app — and a standalone PWA keeps its own
  // storage, so it landed in a copy with no roster and no settings.
  function renderHowto(){
    var out = topbar('If a scan goes wrong', null, 'capture');
    out += '<div class="body">';
    out += '<p class="helper">Scanning is the quick path: <b>Scan the receipt</b> takes the photo and reads it in one go. When a photo will not read — bad light, a fold across the middle, a receipt longer than the frame — there is a way to get the words out without typing them.</p>';

    out += '<h2 class="sec">Let iOS read it instead</h2>';
    out += '<p class="helper" style="margin-bottom:12px;">iPhones recognise text in photos on the device itself, and it is very good. Hand the words over and the app will do the rest.</p>';
    out += '<ol class="steps-list">' +
      '<li>Take a photo of the receipt, or screenshot the digital one.</li>' +
      '<li>Open it in <b>Photos</b> and <b>press and hold</b> the picture.</li>' +
      '<li>Tap <span class="kbd">Copy All Text</span> — or <span class="kbd">Select All</span> then <span class="kbd">Copy</span>.</li>' +
      '<li>Come back here and tap <b>Paste receipt text</b>.</li>' +
      '</ol>';

    out += '<h2 class="sec">Getting a better scan</h2>';
    out += '<ul class="helper" style="padding-left:18px;line-height:1.7;">' +
      '<li>Flatten the receipt and shoot straight down, not at an angle.</li>' +
      '<li>Keep the whole thing in frame, including the total.</li>' +
      '<li>Avoid glare — thermal paper is shiny, so move out from under a spotlight.</li>' +
      '<li>For a very long receipt, the pasted-text route handles it better than one photo.</li>' +
      '</ul>';
    out += '<div class="note">Whatever comes back, check the prices on the review screen. The app warns you when the items stop adding up to the subtotal, which is how a misread digit gets caught.</div>';
    out += '</div>';
    return out;
  }

  /* ---------------- bottom sheets ---------------- */
  var sheetShown = false;

  function sheetHost(){
    var host = document.getElementById('sheet-host');
    if (!host){
      host = document.createElement('div');
      host.id = 'sheet-host';
      document.body.appendChild(host);
    }
    return host;
  }

  function renderSheet(){
    var host = sheetHost();
    var s = state.ui.sheet;
    if (!s){
      host.innerHTML = '';
      sheetShown = false;
      return;
    }
    // Re-rendering on every tap would restart the slide-up animation, so it
    // only plays the first time a given sheet appears.
    var style = sheetShown ? ' style="animation:none"' : '';
    var inner = '';

    if (s.type === 'assign'){
      var d = D();
      var it = d.items.filter(function(x){ return x.id === s.itemId; })[0];
      if (!it){ state.ui.sheet = null; host.innerHTML = ''; return; }
      var who = {};
      (it.who || []).forEach(function(id){ who[id] = true; });
      var n = (it.who || []).length;

      inner = '<div class="grab"></div>' +
        '<h3>' + esc(it.name) + ' · <span class="money">' + fmtMoney(it.cents) + '</span></h3>' +
        '<p class="sub">' + (n === 0 ? 'Nobody tagged yet.' : n === 1 ? 'All theirs.' : 'Split ' + n + ' ways — ' + fmtMoney(Math.round(it.cents / n)) + ' each.') + '</p>' +
        d.people.map(function(p){
          return '<button class="sheet-row ' + (who[p.id] ? 'on' : '') + '" data-action="toggle-who" data-id="' + p.id + '">' +
            avatar(p) + '<span class="nm">' + esc(p.name) + '</span><span class="tick">' + ICONS.check + '</span></button>';
        }).join('') +
        '<div class="sheet-actions">' +
        '<button class="btn btn-secondary btn-sm" data-action="who-all">Everyone</button>' +
        '<button class="btn btn-secondary btn-sm" data-action="who-none">Clear</button>' +
        '<button class="btn btn-primary btn-sm" data-action="close-sheet">Done</button>' +
        '</div>';
    }

    if (s.type === 'addPerson'){
      inner = '<div class="grab"></div>' +
        '<h3>Add someone</h3>' +
        '<p class="sub">They will be saved for next time.</p>' +
        '<form id="add-person-form" autocomplete="off">' +
        '<div class="field"><input id="new-person" type="text" class="text-input" placeholder="Name" autocapitalize="words" maxlength="24"></div>' +
        '<div class="field"><div class="prefix-field"><span class="prefix">' + ICONS.phone + '</span>' +
        '<input id="new-person-phone" type="tel" inputmode="tel" placeholder="Mobile number (optional)"></div></div>' +
        '<div class="sheet-actions" style="margin-top:4px;">' +
        '<button type="button" class="btn btn-secondary" data-action="close-sheet">Cancel</button>' +
        '<button type="submit" class="btn btn-primary">Add</button>' +
        '</div></form>';
    }

    host.innerHTML = '<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"' + style + '>' + inner + '</div>';
    sheetShown = true;

    var input = document.getElementById('new-person');
    if (input){
      setTimeout(function(){ input.focus(); }, 60);
      // Implicit form submission is not something to rely on here — the iOS
      // keyboard's return key is the natural way to add a name, so it is
      // wired up directly rather than left to the form's default behaviour.
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); commitNewPerson(); }
      });
    }
    var form = document.getElementById('add-person-form');
    if (form) form.addEventListener('submit', function(e){ e.preventDefault(); commitNewPerson(); });
  }

  function commitNewPerson(){
    var input = document.getElementById('new-person');
    if (!input) return;
    var p = rosterAdd(input.value);
    if (!p){ state.ui.sheet = null; render(); return; }
    var phoneField = document.getElementById('new-person-phone');
    if (phoneField && phoneField.value.trim()) p.phone = phoneField.value.trim();
    var target = state.ui.sheet && state.ui.sheet.target;
    if (target === 'people' && D() && !D().people.some(function(x){ return x.id === p.id; })){
      D().people.push({ id: p.id, name: p.name, color: p.color, phone: p.phone || '', venmo: p.venmo || '' });
      if (!D().payerId) D().payerId = p.id;
    }
    state.ui.sheet = null;
    save();
    render();
  }

  /* ---------------- render ---------------- */
  function render(){
    var app = document.getElementById('app');
    var html;
    if (sharedView){
      html = renderShared();
    } else {
      switch (state.ui.view){
        case 'capture': html = renderCapture(); break;
        case 'items':   html = D() ? renderItems() : renderHome(); break;
        case 'people':  html = D() ? renderPeople() : renderHome(); break;
        case 'assign':  html = D() ? renderAssign() : renderHome(); break;
        case 'result':  html = D() ? renderResult() : renderHome(); break;
        case 'roster':  html = renderRoster(); break;
        case 'howto':   html = renderHowto(); break;
        case 'settings': html = renderSettings(); break;
        default:        html = renderHome();
      }
    }
    app.innerHTML = html;
    renderSheet();
  }

  function go(view){
    if (view !== 'capture') state.ui.scanError = '';
    state.ui.view = view;
    save();
    render();
    window.scrollTo(0, 0);
  }

  /* ---------------- actions ---------------- */
  // Put the current split on the shelf. Anything with something in it is
  // worth keeping; a blank one that was never used is not.
  function archiveCurrent(){
    var d = D();
    if (!d) return false;
    if (!d.items.length && !d.people.length){ state.dinner = null; return false; }
    d.closedAt = Date.now();
    state.dinners = (state.dinners || []).filter(function(x){ return x.id !== d.id; });
    state.dinners.unshift(d);
    if (state.dinners.length > KEEP_SPLITS) state.dinners.length = KEEP_SPLITS;
    state.dinner = null;
    return true;
  }

  function finishSplit(){
    var saved = archiveCurrent();
    state.ui.open = {};
    save();
    go('home');
    if (saved) showToast('Split saved');
  }

  function openArchived(id){
    var pick = (state.dinners || []).filter(function(x){ return x.id === id; })[0];
    if (!pick) return;
    // Whatever is on the bench goes back on the shelf first, so reopening an
    // old split never costs you the one you were in the middle of.
    archiveCurrent();
    state.dinners = state.dinners.filter(function(x){ return x.id !== id; });
    state.dinner = pick;
    state.ui.open = {};
    save();
    go('result');
  }

  // Nothing here is recoverable once gone, so this is the one place that asks.
  function deleteArchived(id){
    var pick = (state.dinners || []).filter(function(x){ return x.id === id; })[0];
    if (!pick) return;
    if (!window.confirm('Delete the split from ' + (pick.place || 'this dinner') + '? This cannot be undone.')) return;
    state.dinners = state.dinners.filter(function(x){ return x.id !== id; });
    save();
    render();
  }

  function startNew(){
    // No warning and no loss: whatever was in progress is filed away first.
    archiveCurrent();
    state.dinner = newDinner();
    state.ui.open = {};
    go('capture');
  }

  function ingestText(text, announce){
    var d = D() || (state.dinner = newDinner());
    d.rawText = text;
    var res = parseReceipt(text);
    d.items = res.items;
    if (!d.place && res.place) d.place = res.place;
    if (res.tax != null) d.tax = res.tax;
    if (res.tip != null){ d.tip = res.tip; d.tipMode = 'amt'; }
    if (res.total != null) d.total = res.total;
    d.parsedSubtotal = res.subtotal;

    var note;
    if (!res.items.length){
      note = 'No item lines came through. Add them by hand below — name on the left, price on the right.';
    } else {
      note = 'Found ' + res.items.length + ' item' + (res.items.length === 1 ? '' : 's') + '. Give the names and prices a quick look';
      note += res.pairedLoosely ? ' — the prices were in a separate column, so double-check they line up.' : '.';
    }
    d.parseNote = note;
    save();
    go('items');
    if (announce) showToast(res.items.length ? 'Read ' + res.items.length + ' items' : 'Nothing to read');
  }

  function scanFile(file){
    if (!(state.settings.geminiKey || '').trim()){
      state.ui.scanError = '';
      showToast('Add your AI key in Settings first');
      go('settings');
      return;
    }
    state.ui.scanError = '';
    state.ui.busy = 'Reading the receipt…';
    render();

    fileToJpeg(file)
      .then(readReceiptImage)
      .then(function(res){
        state.ui.busy = null;
        ingestExtraction(res);
      })
      .catch(function(err){
        state.ui.busy = null;
        var msg = (err && err.message) || 'That did not work.';
        if (msg === 'NO_KEY'){
          msg = 'No API key set. Add one in Settings.';
        } else if (err instanceof TypeError || /failed to fetch|load failed|networkerror/i.test(msg)){
          // The one risk we knew about going in. Name it plainly rather than
          // leaving a generic network error to be guessed at.
          msg = 'The browser could not reach Google directly — this is the CORS limitation we expected might bite. ' +
                'Your photo was not sent anywhere. Paste the text for now and tell Claude, which needs a small proxy to fix.';
        }
        state.ui.scanError = msg;
        render();
      });
  }

  function ingestExtraction(res){
    var d = D() || (state.dinner = newDinner());
    d.items = res.items;
    if (!d.place && res.place) d.place = res.place;
    if (res.tax != null) d.tax = res.tax;
    if (res.tip != null){ d.tip = res.tip; d.tipMode = 'amt'; }
    if (res.total != null) d.total = res.total;
    d.parsedSubtotal = res.subtotal;

    var n = res.items.length;
    d.parseNote = n
      ? 'Read ' + n + ' item' + (n === 1 ? '' : 's') + ' from the photo. Check the prices against the paper before you go on — a misread digit is the one thing that quietly breaks a split.'
      : 'Nothing readable came back from that photo. Try again with more light and the whole receipt in frame, or add the items by hand.';
    save();
    go('items');
    showToast(n ? 'Read ' + n + ' items' : 'Nothing readable');
  }

  function toggleRosterPerson(id){
    var d = D();
    var p = state.roster.filter(function(x){ return x.id === id; })[0];
    if (!p) return;
    var at = -1;
    d.people.forEach(function(x, i){ if (x.id === id) at = i; });
    if (at >= 0){
      d.people.splice(at, 1);
      d.items.forEach(function(it){
        it.who = (it.who || []).filter(function(w){ return w !== id; });
      });
      if (d.payerId === id) d.payerId = d.people.length ? d.people[0].id : null;
    } else {
      d.people.push({ id: p.id, name: p.name, color: p.color, phone: p.phone || '', venmo: p.venmo || '' });
      if (!d.payerId) d.payerId = p.id;
    }
    save();
    render();
  }

  function shareResult(){
    var url = encodeShare(D());
    var title = (D().place ? D().place + ' — ' : '') + 'the damage';
    // The handle rides in the message, which you address and send, rather
    // than in the link, which carries on without you. Whose handle depends on
    // who actually picked up the check.
    var payer = person(D().payerId);
    var tag = handleFor(payer);
    var text = 'Here is what everyone owes' + (payer ? ' ' + payer.name : '') +
      (tag ? ' — Venmo ' + tag : '') + ':';
    if (navigator.share){
      navigator.share({ title: title, text: text, url: url }).catch(function(){});
      return;
    }
    copyToClipboard(url).then(function(){ showToast('Link copied'); }, function(){ showToast('Could not copy the link'); });
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    var d = D();

    switch (action){
      case 'go': go(el.getAttribute('data-view')); break;
      case 'resume': go(state.dinner && state.dinner.people.length ? 'assign' : 'items'); break;
      case 'start-new': startNew(); break;

      case 'paste-clip':
        if (navigator.clipboard && navigator.clipboard.readText){
          navigator.clipboard.readText().then(function(text){
            if (text && text.trim()) ingestText(text, true);
            else showToast('Clipboard is empty');
          }, function(){
            showToast('Paste into the box below instead');
            var ta = document.getElementById('raw');
            if (ta) ta.focus();
          });
        } else {
          showToast('Paste into the box below instead');
          var ta = document.getElementById('raw');
          if (ta) ta.focus();
        }
        break;

      case 'parse-raw': {
        var box = document.getElementById('raw');
        var text = box ? box.value : (d && d.rawText) || '';
        if (!text.trim()){ showToast('Nothing to read yet'); break; }
        ingestText(text, true);
        break;
      }
      case 'skip-to-items':
        if (!D()) state.dinner = newDinner();
        if (!D().items.length) D().items.push({ id: uid(), name: '', cents: 0, qty: 1, who: [] });
        D().parseNote = '';
        save();
        go('items');
        break;

      case 'add-item':
        d.items.push({ id: uid(), name: '', cents: 0, qty: 1, who: [] });
        save();
        render();
        setTimeout(function(){
          var fields = document.querySelectorAll('[data-bind="item-name"]');
          if (fields.length) fields[fields.length - 1].focus();
        }, 20);
        break;
      case 'del-item':
        d.items = d.items.filter(function(it){ return it.id !== id; });
        save();
        render();
        break;
      case 'tip-mode':
        d.tipMode = el.getAttribute('data-mode');
        save();
        render();
        break;

      case 'shoot': {
        var cam = document.getElementById('shot-cam');
        if (cam) cam.click();
        break;
      }
      case 'pick': {
        var lib = document.getElementById('shot-lib');
        if (lib) lib.click();
        break;
      }

      case 'to-people': go('people'); break;
      case 'toggle-person': toggleRosterPerson(id); break;
      case 'sheet-add-person':
        state.ui.sheet = { type: 'addPerson', target: state.ui.view === 'roster' ? 'roster' : 'people' };
        render();
        break;
      case 'set-me':
        // Tapping the one already chosen clears it, so you can undo a mis-tap.
        state.settings.meId = (state.settings.meId === id) ? null : id;
        save();
        render();
        break;
      case 'set-payer':
        d.payerId = (d.payerId === id) ? null : id;
        save();
        render();
        break;
      case 'to-assign': go('assign'); break;

      case 'sheet-assign':
        state.ui.sheet = { type: 'assign', itemId: id };
        render();
        break;
      case 'toggle-who': {
        var item = d.items.filter(function(x){ return x.id === state.ui.sheet.itemId; })[0];
        if (!item) break;
        item.who = item.who || [];
        var pos = item.who.indexOf(id);
        if (pos >= 0) item.who.splice(pos, 1); else item.who.push(id);
        save();
        render();
        break;
      }
      case 'who-all': {
        var i2 = d.items.filter(function(x){ return x.id === state.ui.sheet.itemId; })[0];
        if (i2){ i2.who = d.people.map(function(p){ return p.id; }); save(); render(); }
        break;
      }
      case 'who-none': {
        var i3 = d.items.filter(function(x){ return x.id === state.ui.sheet.itemId; })[0];
        if (i3){ i3.who = []; save(); render(); }
        break;
      }
      case 'all-shared':
        d.items.forEach(function(it){
          if (!(it.who || []).length) it.who = d.people.map(function(p){ return p.id; });
        });
        save();
        render();
        break;
      case 'close-sheet':
        state.ui.sheet = null;
        render();
        break;

      case 'to-result': go('result'); break;
      case 'finish-split': finishSplit(); break;
      case 'open-archived': openArchived(id); break;
      case 'del-archived': deleteArchived(id); break;
      case 'toggle-open':
        state.ui.open[id] = !state.ui.open[id];
        save();
        render();
        break;
      case 'copy-link':
        copyToClipboard(encodeShare(D())).then(function(){ showToast('Link copied'); }, function(){ showToast('Could not copy the link'); });
        break;
      case 'copy-message': {
        // The same words the text message would have carried, for someone
        // whose number is not saved — paste it wherever you talk to them.
        var split = computeSplit(d);
        var share = split.people.filter(function(x){ return x.id === id; })[0];
        if (!share) break;
        var mineNow = state.settings.meId
          ? split.people.filter(function(x){ return x.id === state.settings.meId; })[0]
          : null;
        var body = (id === d.payerId && mineNow && mineNow.id !== d.payerId)
          ? payerMessage(d, mineNow)
          : oweMessage(d, share);
        copyToClipboard(body)
          .then(function(){ showToast('Message for ' + share.name + ' copied'); }, function(){ showToast('Could not copy'); });
        break;
      }
      case 'share-link': shareResult(); break;

      case 'leave-shared':
        sharedView = null;
        history.replaceState(null, '', location.pathname);
        go('home');
        break;

      case 'cycle-color': {
        var rp = state.roster.filter(function(x){ return x.id === id; })[0];
        if (!rp) break;
        var next = (PERSON_COLORS.indexOf(rp.color) + 1) % PERSON_COLORS.length;
        rp.color = PERSON_COLORS[next];
        if (D()) D().people.forEach(function(x){ if (x.id === id) x.color = rp.color; });
        save();
        render();
        break;
      }
      case 'del-person':
        state.roster = state.roster.filter(function(x){ return x.id !== id; });
        save();
        render();
        break;
    }
  });

  // Typing updates state without a re-render, so the keyboard keeps its place.
  // Only the derived figures are refreshed, in place.
  document.addEventListener('input', function(e){
    var el = e.target;
    var bind = el.getAttribute && el.getAttribute('data-bind');
    if (!bind) return;
    var d = D();
    var id = el.getAttribute('data-id');

    if (bind === 'raw'){ if (d) d.rawText = el.value; return; }
    if (!d && ['place','date','item-name','item-price','tax','tip','tippct','total'].indexOf(bind) >= 0) return;

    switch (bind){
      case 'place': d.place = el.value; break;
      case 'date': d.date = el.value; break;
      case 'item-name': {
        var it = d.items.filter(function(x){ return x.id === id; })[0];
        if (it) it.name = el.value;
        break;
      }
      case 'item-price': {
        var ip = d.items.filter(function(x){ return x.id === id; })[0];
        if (ip) ip.cents = parseMoney(el.value) || 0;
        refreshTotals();
        break;
      }
      case 'tax': d.tax = parseMoney(el.value); refreshTotals(); break;
      case 'tip': d.tip = parseMoney(el.value); refreshTotals(); break;
      case 'tippct': {
        var pct = parseFloat(el.value);
        d.tipPct = isFinite(pct) ? pct : 0;
        refreshTotals();
        break;
      }
      case 'total': d.total = parseMoney(el.value); refreshTotals(); break;
      case 'roster-name': {
        var rp = state.roster.filter(function(x){ return x.id === id; })[0];
        if (rp){
          rp.name = el.value;
          if (d) d.people.forEach(function(x){ if (x.id === id) x.name = el.value; });
        }
        break;
      }
      case 'roster-venmo': {
        var rv = state.roster.filter(function(x){ return x.id === id; })[0];
        if (rv){
          rv.venmo = el.value;
          if (d) d.people.forEach(function(x){ if (x.id === id) x.venmo = el.value; });
        }
        break;
      }
      case 'roster-phone': {
        var rq = state.roster.filter(function(x){ return x.id === id; })[0];
        if (rq){
          rq.phone = el.value;
          // Keep the current dinner's copy in step, so a number added midway
          // through a split is usable on the result screen straight away.
          if (d) d.people.forEach(function(x){ if (x.id === id) x.phone = el.value; });
        }
        break;
      }
      case 'venmo':
        state.settings.venmo = el.value;
        break;
      case 'gkey':
        state.settings.geminiKey = el.value;
        // A new key may belong to a different model tier, so stop pinning the
        // one the previous key happened to answer on.
        state.settings.geminiModel = '';
        break;
    }
  });
  document.addEventListener('change', function(e){
    if (e.target.id === 'shot-cam' || e.target.id === 'shot-lib'){
      var f = e.target.files && e.target.files[0];
      // Clear it so picking the very same photo again still fires a change.
      e.target.value = '';
      if (f) scanFile(f);
      return;
    }
    if (e.target.getAttribute && e.target.getAttribute('data-bind')) save();
  });
  // Tidy the money fields once the keyboard goes away: "7" becomes "7.00".
  document.addEventListener('blur', function(e){
    var el = e.target;
    var bind = el.getAttribute && el.getAttribute('data-bind');
    if (!bind) return;
    if (['item-price','tax','tip','total'].indexOf(bind) >= 0){
      var cents = parseMoney(el.value);
      el.value = cents == null ? '' : fmtPlain(cents);
      save();
    }
  }, true);

  /* ---------------- boot ---------------- */
  function applyHash(){
    var hash = location.hash || '';

    // A breakdown someone shared. Rendered read-only and never saved, so it
    // cannot clobber a split of the reader's own.
    if (hash.indexOf('#s=') === 0){
      try{
        sharedView = decodeShare(hash.slice(3));
        // A link addressed to one person opens on their detail, so they can
        // see what they are being asked to pay for without tapping anything.
        if (sharedView.youId) state.ui.open[sharedView.youId] = true;
      }catch(err){
        sharedView = null;
        showToast('That shared link is damaged');
      }
      render();
      return;
    }

    // Text handed over by the Shortcut. The fragment is dropped straight away
    // so a reload does not import the same receipt twice.
    if (hash.indexOf('#t=') === 0){
      var text = '';
      try{ text = decodeURIComponent(hash.slice(3).replace(/\+/g, ' ')); }catch(err){ text = hash.slice(3); }
      history.replaceState(null, '', location.pathname);
      sharedView = null;
      if (text.trim()){
        state.dinner = newDinner();
        state.ui.open = {};
        ingestText(text, true);
        return;
      }
    }

    sharedView = null;
    render();
  }

  applyHash();

  // Opening a shared link while the app is already running changes only the
  // fragment, and that does not reload the page or re-run any of the above —
  // so the same handling is wired to the fragment changing, too.
  window.addEventListener('hashchange', applyHash);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      // updateViaCache:'none' bypasses GitHub Pages' Cache-Control: max-age=600
      // when checking sw.js for changes; reg.update() forces an immediate
      // check; auto-reload on controllerchange applies an update as soon as
      // it activates, instead of requiring a manual reopen.
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg){
        reg.update();
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
      }).catch(function(){});
    });
  }
})();
</script>
</body>
</html>
